<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title description">
  <title id="title">Modelo de dados do sistema da oficina</title>
  <desc id="description">Diagrama dos principais dados armazenados no PostgreSQL e seus relacionamentos.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke-width: 3; filter: url(#shadow); }
      .name { font: 700 25px Arial, Helvetica, sans-serif; fill: #0f172a; text-anchor: middle; }
      .detail { font: 19px Arial, Helvetica, sans-serif; fill: #475569; text-anchor: middle; }
      .relation { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .relation-label { font: 700 17px Arial, Helvetica, sans-serif; fill: #475569; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1800" height="1100" rx="28" fill="#f8fafc"/>
  <text x="900" y="65" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#0f172a">
    Modelo de dados — PostgreSQL
  </text>
  <text x="900" y="103" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#64748b">
    Principais entidades e relacionamentos do sistema da oficina
  </text>

  <!-- Relacionamentos -->
  <g>
    <path class="relation" d="M310 260 H395"/>
    <text class="relation-label" x="352" y="248">1:1</text>

    <path class="relation" d="M210 335 V425"/>
    <text class="relation-label" x="235" y="386">1:N</text>

    <path class="relation" d="M785 335 V375 H575 V425"/>
    <text class="relation-label" x="680" y="365">0:1</text>

    <path class="relation" d="M895 260 H980"/>
    <text class="relation-label" x="937" y="248">1:N</text>

    <path class="relation" d="M700 510 H790"/>
    <text class="relation-label" x="745" y="498">1:N</text>

    <path class="relation" d="M1030 600 V695 H450 V760"/>
    <text class="relation-label" x="745" y="686">1:N</text>

    <path class="relation" d="M1030 600 V695 H1240 V760"/>
    <text class="relation-label" x="1140" y="686">1:N</text>

    <path class="relation" d="M570 835 H665"/>
    <text class="relation-label" x="618" y="823">N:1</text>

    <path class="relation" d="M1360 835 H1455"/>
    <text class="relation-label" x="1408" y="823">N:1</text>

    <path class="relation" d="M310 510 H790"/>
    <text class="relation-label" x="550" y="498">1:N</text>
  </g>

  <!-- Cadastro -->
  <g>
    <rect class="box" x="90" y="185" width="220" height="150" rx="18" stroke="#2563eb"/>
    <text class="name" x="200" y="235">Cliente</text>
    <text class="detail" x="200" y="274">CPF, CNPJ ou RG</text>
    <text class="detail" x="200" y="304">dados cadastrais</text>

    <rect class="box" x="395" y="185" width="220" height="150" rx="18" stroke="#2563eb"/>
    <text class="name" x="505" y="235">Endereço</text>
    <text class="detail" x="505" y="274">logradouro e CEP</text>
    <text class="detail" x="505" y="304">cidade e estado</text>

    <rect class="box" x="90" y="425" width="220" height="170" rx="18" stroke="#0284c7"/>
    <text class="name" x="200" y="475">Veículo</text>
    <text class="detail" x="200" y="514">placa e tipo</text>
    <text class="detail" x="200" y="544">marca e modelo</text>
    <text class="detail" x="200" y="574">ano e quilometragem</text>

    <rect class="box" x="450" y="425" width="250" height="170" rx="18" stroke="#0284c7"/>
    <text class="name" x="575" y="475">Funcionário</text>
    <text class="detail" x="575" y="514">administrador</text>
    <text class="detail" x="575" y="544">vendedor</text>
    <text class="detail" x="575" y="574">mecânico</text>
  </g>

  <!-- Autenticação -->
  <g>
    <rect class="box" x="675" y="185" width="220" height="150" rx="18" stroke="#7c3aed"/>
    <text class="name" x="785" y="235">Usuário</text>
    <text class="detail" x="785" y="274">login e senha</text>
    <text class="detail" x="785" y="304">perfil e status</text>

    <rect class="box" x="980" y="185" width="320" height="150" rx="18" stroke="#7c3aed"/>
    <text class="name" x="1140" y="235">Refresh Token</text>
    <text class="detail" x="1140" y="274">hash e expiração</text>
    <text class="detail" x="1140" y="304">rotação e revogação</text>
  </g>

  <!-- Agregado central -->
  <g>
    <rect x="790" y="405" width="480" height="195" rx="24" fill="#eff6ff" stroke="#1d4ed8" stroke-width="5" filter="url(#shadow)"/>
    <text x="1030" y="463" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#1e3a8a">Ordem de Serviço</text>
    <text class="detail" x="1030" y="505">estado e código de acompanhamento</text>
    <text class="detail" x="1030" y="539">datas, valores e responsável</text>
    <text class="detail" x="1030" y="573">agregado central do domínio</text>
  </g>

  <!-- Itens da OS -->
  <g>
    <rect class="box" x="290" y="760" width="280" height="150" rx="18" stroke="#d97706"/>
    <text class="name" x="430" y="810">Serviço da OS</text>
    <text class="detail" x="430" y="849">quantidade e valor</text>
    <text class="detail" x="430" y="879">desconto e acréscimo</text>

    <rect class="box" x="665" y="760" width="250" height="150" rx="18" stroke="#d97706"/>
    <text class="name" x="790" y="810">Serviço</text>
    <text class="detail" x="790" y="849">descrição</text>
    <text class="detail" x="790" y="879">valor de catálogo</text>

    <rect class="box" x="1080" y="760" width="280" height="150" rx="18" stroke="#16a34a"/>
    <text class="name" x="1220" y="810">Produto da OS</text>
    <text class="detail" x="1220" y="849">quantidade e valor</text>
    <text class="detail" x="1220" y="879">desconto e acréscimo</text>

    <rect class="box" x="1455" y="760" width="250" height="150" rx="18" stroke="#16a34a"/>
    <text class="name" x="1580" y="810">Produto</text>
    <text class="detail" x="1580" y="849">descrição e preço</text>
    <text class="detail" x="1580" y="879">estoque disponível</text>
  </g>

  <!-- Rodapé -->
  <g>
    <ellipse cx="900" cy="990" rx="210" ry="38" fill="#336791"/>
    <rect x="690" y="954" width="420" height="70" fill="#336791"/>
    <ellipse cx="900" cy="954" rx="210" ry="38" fill="#4f91bd"/>
    <ellipse cx="900" cy="1024" rx="210" ry="38" fill="#285578"/>
    <text x="900" y="1000" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff">PostgreSQL</text>
  </g>
</svg>
