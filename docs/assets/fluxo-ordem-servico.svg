<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="600" viewBox="0 0 1800 600" role="img" aria-labelledby="title description">
  <title id="title">Fluxo principal da Ordem de Serviço</title>
  <desc id="description">Fluxo da Ordem de Serviço entre os estados Recebida, Em diagnóstico, Aguardando aprovação, Em execução, Finalizada e Entregue.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1800" height="600" rx="28" fill="#f8fafc"/>
  <text x="900" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#0f172a">
    Fluxo principal da Ordem de Serviço
  </text>
  <text x="900" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#64748b">
    Ciclo de atendimento implementado no sistema da oficina
  </text>

  <g stroke="#64748b" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <path d="M280 270 H326"/>
    <path d="M560 270 H606"/>
    <path d="M840 270 H886"/>
    <path d="M1120 270 H1166"/>
    <path d="M1400 270 H1446"/>
  </g>

  <g filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g>
      <rect x="60" y="195" width="220" height="150" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
      <circle cx="170" cy="230" r="20" fill="#2563eb"/>
      <text x="170" y="237" font-size="20" font-weight="700" fill="#ffffff">1</text>
      <text x="170" y="296" font-size="29" font-weight="700" fill="#1e3a8a">Recebida</text>
    </g>

    <g>
      <rect x="340" y="195" width="220" height="150" rx="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="4"/>
      <circle cx="450" cy="230" r="20" fill="#0284c7"/>
      <text x="450" y="237" font-size="20" font-weight="700" fill="#ffffff">2</text>
      <text x="450" y="284" font-size="27" font-weight="700" fill="#0c4a6e">Em</text>
      <text x="450" y="318" font-size="27" font-weight="700" fill="#0c4a6e">diagnóstico</text>
    </g>

    <g>
      <rect x="620" y="195" width="220" height="150" rx="20" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
      <circle cx="730" cy="230" r="20" fill="#d97706"/>
      <text x="730" y="237" font-size="20" font-weight="700" fill="#ffffff">3</text>
      <text x="730" y="284" font-size="25" font-weight="700" fill="#78350f">Aguardando</text>
      <text x="730" y="318" font-size="25" font-weight="700" fill="#78350f">aprovação</text>
    </g>

    <g>
      <rect x="900" y="195" width="220" height="150" rx="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="4"/>
      <circle cx="1010" cy="230" r="20" fill="#7c3aed"/>
      <text x="1010" y="237" font-size="20" font-weight="700" fill="#ffffff">4</text>
      <text x="1010" y="284" font-size="27" font-weight="700" fill="#4c1d95">Em</text>
      <text x="1010" y="318" font-size="27" font-weight="700" fill="#4c1d95">execução</text>
    </g>

    <g>
      <rect x="1180" y="195" width="220" height="150" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
      <circle cx="1290" cy="230" r="20" fill="#16a34a"/>
      <text x="1290" y="237" font-size="20" font-weight="700" fill="#ffffff">5</text>
      <text x="1290" y="296" font-size="29" font-weight="700" fill="#14532d">Finalizada</text>
    </g>

    <g>
      <rect x="1460" y="195" width="220" height="150" rx="20" fill="#ccfbf1" stroke="#0f766e" stroke-width="4"/>
      <circle cx="1570" cy="230" r="20" fill="#0f766e"/>
      <text x="1570" y="237" font-size="20" font-weight="700" fill="#ffffff">6</text>
      <text x="1570" y="296" font-size="29" font-weight="700" fill="#134e4a">Entregue</text>
    </g>
  </g>

  <rect x="340" y="425" width="1120" height="92" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="900" y="465" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#334155">
    Fluxos alternativos
  </text>
  <text x="900" y="497" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#64748b">
    Reprovação do orçamento • Retorno ao diagnóstico • Cancelamento da OS
  </text>
</svg>
