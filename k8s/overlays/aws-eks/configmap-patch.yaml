apiVersion: v1
kind: ConfigMap
metadata:
  name: techchallenge-api-config
# Configuração NÃO sensível do ambiente AWS EKS.
# A terminação TLS e o roteamento ficam no API Gateway, à frente do cluster.
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_HTTP_PORTS: "8080"
  # TLS é encerrado no API Gateway; dentro do cluster o tráfego é HTTP.
  Http__UseHttpsRedirection: "false"

  # Resource server: valida somente JWT RS256 emitido pela Function Serverless.
  # Substituir o placeholder pela URL pública do emissor no API Gateway. A URL
  # deve publicar {Authority}/.well-known/openid-configuration e apontar para o JWKS.
  Jwt__Authority: "https://replace-me.execute-api.us-east-1.amazonaws.com/auth"
  Jwt__Issuer: "https://replace-me.execute-api.us-east-1.amazonaws.com/auth"
  Jwt__Audience: "techchallenge-api"
  Jwt__RequireHttpsMetadata: "true"
  Jwt__EnableLocalIssuance: "false"

  # Links de aprovação/recusa do orçamento. Ajustar BaseUrl para a URL pública
  # do API Gateway quando ela estiver definida pelo repositório de infraestrutura.
  ApprovalLinks__BaseUrl: "https://replace-me.execute-api.us-east-1.amazonaws.com"
  ApprovalLinks__ExpirationHours: "48"

  # Worker de notificações (outbox).
  Notifications__Enabled: "true"
  Notifications__IntervalSeconds: "5"

  # Seed inicial: apenas usuário administrador, sem dados fake/demo.
  Seed__AdminLogin: "admin"
  Seed__FakeData: "false"
  Seed__DemoData: "false"

  # SMTP não sensível. Host/credenciais do provedor gerenciado (ex.: SES) são
  # fornecidos pelo Secret techchallenge-api-secrets.
  Smtp__UseSsl: "true"
  Smtp__AllowInsecureConnection: "false"
  Smtp__FromAddress: "nao-responda@techchallenge.local"
  Smtp__FromName: "Oficina Tech Challenge"
