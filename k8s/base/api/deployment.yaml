apiVersion: apps/v1
kind: Deployment
metadata:
  name: techchallenge-api
  labels:
    app.kubernetes.io/name: techchallenge-api
    app.kubernetes.io/part-of: techchallenge
    app.kubernetes.io/component: api
spec:
  # Sem replicas fixo: o HPA do overlay controla a escala.
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Rollout sem indisponibilidade: cria o pod novo antes de remover o antigo.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: techchallenge-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: techchallenge-api
        app.kubernetes.io/part-of: techchallenge
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: techchallenge-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Tag neutra substituída pela imagem imutável do ECR em cada overlay.
          image: techchallenge-application:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            # Configuração não sensível do ambiente.
            - configMapRef:
                name: techchallenge-api-config
            # Segredos criados pelo repositório de infraestrutura (connection
            # string, chave dos links de aprovação, API key, SMTP e senha de seed).
            # A API obtém somente chaves JWT públicas pelo discovery/JWKS.
            - secretRef:
                name: techchallenge-api-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            # Cobre migrations e seed executados antes de servir HTTP.
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 150
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            # Sistema de arquivos raiz somente leitura: /tmp fica em volume efêmero.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
