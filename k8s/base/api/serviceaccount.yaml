apiVersion: v1
kind: ServiceAccount
metadata:
  name: techchallenge-api
# Conta dedicada da aplicação. O repositório de infraestrutura pode anexar uma
# IAM Role via IRSA (eks.amazonaws.com/role-arn) caso a aplicação precise de
# acesso a serviços da AWS. Token não é montado automaticamente no pod.
automountServiceAccountToken: false
