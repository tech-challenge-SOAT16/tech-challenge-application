# Stack local de observabilidade: OpenTelemetry Collector, Prometheus, Loki,
# Tempo e Grafana em um único container (grafana/otel-lgtm).
# A API envia traces, métricas e logs via OTLP para otel-lgtm:4317.
services:
  otel-lgtm:
    image: grafana/otel-lgtm:0.38.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/otel-lgtm/grafana/conf/provisioning/dashboards/techchallenge/techchallenge-ordens-servico.json"
    volumes:
      - otel-lgtm-data:/data
      - ./monitoring/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/techchallenge.yaml:ro
      - ./monitoring/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards/techchallenge:ro
      - ./monitoring/alerting/techchallenge.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/techchallenge.yaml:ro

volumes:
  otel-lgtm-data:
