include:
  - docker-compose.monitoring.yml

services:
  techchallenge.api:
    image: ${DOCKER_REGISTRY-}techchallengeapi
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=TechChallenge;Username=postgres;Password=Dev@123456"
      IntegracaoExterna__ApiKey: "${EXTERNAL_INTEGRATION_API_KEY:-demo-integration-key-change-me}"
      Notifications__Enabled: "true"
      Notifications__IntervalSeconds: "2"
      ApprovalLinks__BaseUrl: "${APPROVAL_LINK_BASE_URL:-http://localhost:8080}"
      ApprovalLinks__ExpirationHours: "48"
      Smtp__Host: "mailpit"
      Smtp__Port: "1025"
      Smtp__UseSsl: "false"
      Smtp__AllowInsecureConnection: "true"
      Smtp__FromAddress: "nao-responda@oficina.local"
      Smtp__FromName: "Oficina Tech Challenge"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-lgtm:4317"
      OTEL_SERVICE_NAME: "techchallenge-api"
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: "Warning"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      otel-lgtm:
        condition: service_started
    # Mesmo endpoint do readiness probe do Kubernetes; alimenta o painel de health checks.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    build:
      context: ..
      dockerfile: src/TechChallenge.Api/Dockerfile

  db: 
    image: postgres:latest
    environment:
      POSTGRES_DB: "TechChallenge"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "Dev@123456"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d TechChallenge"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.31.0
    restart: unless-stopped

  sonarqube:
    image: sonarqube:community
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

  # O banco do Kong é separado do banco de negócio. Ele guarda apenas a
  # configuração do gateway: serviços, rotas, consumidores e plugins.
  kong-db:
    image: postgres:17-alpine
    profiles: ["gateway"]
    environment:
      POSTGRES_DB: "kong"
      POSTGRES_USER: "kong"
      POSTGRES_PASSWORD: "${KONG_PG_PASSWORD:-kong-local-only}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong -d kong"]
      interval: 5s
      timeout: 5s
      retries: 12

  kong-migrations:
    image: kong:3.8
    profiles: ["gateway"]
    environment: &kong_database_environment
      KONG_DATABASE: "postgres"
      KONG_PG_HOST: "kong-db"
      KONG_PG_DATABASE: "kong"
      KONG_PG_USER: "kong"
      KONG_PG_PASSWORD: "${KONG_PG_PASSWORD:-kong-local-only}"
    depends_on:
      kong-db:
        condition: service_healthy
    command: /bin/sh -c 'kong migrations bootstrap || kong migrations up'
    restart: "no"

  kong:
    image: kong:3.8
    profiles: ["gateway"]
    environment:
      <<: *kong_database_environment
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_ADMIN_GUI_LISTEN: "0.0.0.0:8002"
      KONG_ADMIN_GUI_URL: "http://localhost:8002"
      KONG_LOG_LEVEL: "info"
    depends_on:
      kong-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Cria de forma idempotente a configuração que também pode ser inspecionada
  # no Kong Manager. JWT só é habilitado quando a chave pública da Lambda for
  # fornecida nas variáveis documentadas em docker-compose/kong/README.md.
  kong-config:
    image: curlimages/curl:8.12.1
    profiles: ["gateway"]
    environment:
      KONG_ADMIN_URL: "http://kong:8001"
      CPF_AUTH_UPSTREAM_URL: "${CPF_AUTH_UPSTREAM_URL:-}"
      JWT_ISSUER: "${JWT_ISSUER:-}"
      JWT_PUBLIC_KEY_BASE64: "${JWT_PUBLIC_KEY_BASE64:-}"
    volumes:
      - ../docker-compose/kong:/scripts:ro
    depends_on:
      kong:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/bootstrap.sh"]
    restart: "no"

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
