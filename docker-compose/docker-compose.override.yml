services:
  techchallenge.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
    ports:
      - "8080:8080"
  db:
    ports:
      - "5432:5432"
  mailpit:
    ports:
      - "8025:8025"
  sonarqube:
    ports:
      - "9000:9000"
  kong:
    ports:
      - "8000:8000" # Proxy público local
      - "127.0.0.1:8001:8001" # Admin API: nunca publicar fora da máquina
      - "127.0.0.1:8002:8002" # Kong Manager
