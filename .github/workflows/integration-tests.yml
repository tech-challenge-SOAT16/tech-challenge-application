name: Integration tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-tests:
    name: Run integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore tests/TechChallenge.IntegrationTests/TechChallenge.IntegrationTests.csproj

      - name: Test
        run: dotnet test tests/TechChallenge.IntegrationTests/TechChallenge.IntegrationTests.csproj --configuration Release --no-restore
