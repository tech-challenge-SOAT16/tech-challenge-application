name: Deploy to Amazon EKS

# Dispara deploy automático nas branches de homologação e produção, conforme
# a regra "Deploy automático das branches de homologação e produção" do PDF.
# O GitHub Environment é selecionado pela branch, isolando AWS_ROLE_ARN,
# AWS_REGION e EKS_CLUSTER_NAME por ambiente.
on:
  push:
    branches:
      - main
      - homologacao
on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'k8s/overlays/**'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-eks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    name: Build, test and validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore TechChallenge.slnx

      - name: Build
        run: dotnet build TechChallenge.slnx --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test tests/TechChallenge.Tests/TechChallenge.Tests.csproj --configuration Release --no-build

      - name: Integration tests
        run: dotnet test tests/TechChallenge.IntegrationTests/TechChallenge.IntegrationTests.csproj --configuration Release --no-build

      - name: Install kustomize
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "$url" -o kustomize.tar.gz
          tar -xzf kustomize.tar.gz
          sudo install -m 0755 kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Render and validate manifests
        shell: bash
        run: |
          set -euo pipefail
          echo "== k8s/base =="
          kustomize build k8s/base >/dev/null
          echo "== ${KUSTOMIZE_OVERLAY} =="
          kustomize build "${KUSTOMIZE_OVERLAY}" >/dev/null

      - run: dotnet restore TechChallenge.slnx
      - run: dotnet build TechChallenge.slnx --configuration Release --no-restore
      - run: dotnet test tests/TechChallenge.Tests/TechChallenge.Tests.csproj --configuration Release --no-build
      - run: dotnet test tests/TechChallenge.IntegrationTests/TechChallenge.IntegrationTests.csproj --configuration Release --no-build
  deploy:
    name: Publish image and propose GitOps deployment
    needs: validate
    if: vars.AWS_DEPLOY_ENABLED == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    # main -> environment production ; homologacao -> environment homologacao.
    # Cada environment possui seus próprios secrets/variables (AWS_ROLE_ARN,
    # AWS_REGION, EKS_CLUSTER_NAME), permitindo apontar para clusters/contas
    # diferentes sem alterar o workflow.
    environment: ${{ github.ref_name == 'main' && 'production' || 'homologacao' }}
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'homolog' }}
    permissions:
      contents: write
      id-token: write
    env:
      ECR_REPOSITORY: techchallenge-application
      OVERLAY: ${{ github.ref == 'refs/heads/main' && 'aws-eks' || 'aws-eks-homolog' }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Resolve immutable image
        id: image
        run: echo "uri=${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/TechChallenge.Api/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.image.outputs.uri }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prepare deployment branch from main
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          set -euo pipefail
          git fetch origin main
          branch="deploy/${OVERLAY}-${GITHUB_RUN_ID}"
          git checkout -b "$branch" origin/main
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          p=Path('k8s/overlays')/os.environ['OVERLAY']/'kustomization.yaml'
          name,tag=os.environ['IMAGE'].rsplit(':',1)
          s=p.read_text()
          s=re.sub(r'newName: .*', 'newName: '+name,s)
          s=re.sub(r'newTag: .*', 'newTag: '+tag,s)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "k8s/overlays/$OVERLAY/kustomization.yaml"
          if git diff --cached --quiet; then
            echo 'The desired image is already in Git.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "deploy: update ${OVERLAY} image"
          git push origin "$branch"
          printf 'Image: `%s`\n\nBranch: `%s`\n\nOpen a reviewed PR: https://github.com/%s/compare/main...%s\n\nAfter merge Argo CD performs the rollout automatically.\n' "$IMAGE" "$branch" "$GITHUB_REPOSITORY" "$branch" >> "$GITHUB_STEP_SUMMARY"
